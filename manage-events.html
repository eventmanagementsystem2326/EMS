<!DOCTYPE html>
<html>
<head>
  <title>Manage Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
    body{display:flex;height:100vh;background:#f4f6f9;}
    .sidebar{width:240px;background:linear-gradient(180deg,#5f2c82,#49a09d);color:white;padding:30px 20px;}
    .sidebar h2{margin-bottom:40px;}
    .sidebar a{display:block;color:white;text-decoration:none;margin-bottom:15px;padding:10px;border-radius:8px;}
    .sidebar a:hover{background:rgba(255,255,255,0.2);}
    .main{flex:1;padding:40px;overflow:auto;}
    h1{margin-bottom:20px;}
    .form{background:white;padding:20px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.05);margin-bottom:30px;}
    input,select{width:100%;padding:10px;margin-bottom:15px;border-radius:8px;border:1px solid #ddd;}
    button{padding:8px 14px;background:#5f2c82;color:white;border:none;border-radius:6px;cursor:pointer;margin-right:5px;}
    button:hover{opacity:0.9;}
    table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;}
    th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;}
    th{background:#f4f6f9;}
    a.download{color:#5f2c82;font-weight:600;text-decoration:none;}
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <a href="admin-dashboard.html">Dashboard</a>
  <a href="manage-events.html">Manage Events</a>
  <a href="manage-competitions.html">Manage Competitions</a>
  <a href="manage-homescreen.html">Manage Highlights</a>
  <a href="#">View Registrations</a>
  <a href="#">Report Generator</a>
  <a href="login.html">Logout</a>
</div>

<div class="main">
  <h1>Manage Events</h1>

  <div class="form">

    <input type="text" id="theme" placeholder="Event Theme">

    <select id="category">
      <option value="">Select Internal / External</option>
      <option value="Internal">Internal</option>
      <option value="External">External</option>
    </select>

    <div id="clubContainer">
      <select id="club">
        <option value="">Select Club</option>
        <option value="Coding Club">Coding Club</option>
        <option value="Cultural Club">Cultural Club</option>
        <option value="Sports Club">Sports Club</option>
        <option value="Management Club">Management Club</option>
      </select>
    </div>

    <!-- DATE -->
    <input type="date" id="date">

    <input type="text" id="time" placeholder="Select Time" onfocus="(this.type='time')">

    <!-- ✅ UPDATED VENUE -->
    <select id="venue">
      <option value="">Select Venue</option>
      <option value="Auditorium">SVS Auditorium</option>
      <option value="Seminar Hall">APJ Abdul Kalam</option>
      <option value="Conference Room">Aryabhata</option>
      <option value="Lab">Bill Gates(Lab)</option>
      <option value="Classroom">Dr B R Ambedkar</option>
      <option value="Classroom1">Varahamihira</option>
      <option value="Classroom2">Bhagat Singh</option>
      <option value="Classroom3">Charaka</option>
      <option value="Open Ground">Open Ground</option>
      <option value="Other">Other</option>
    </select>

    <input type="text" id="otherVenue" placeholder="Enter Custom Venue" style="display:none;">

    <input type="text" id="resourcePerson" placeholder="Resource Person Name (Optional)">

    <select id="audience">
      <option value="">Select Target Audience</option>
      <option value="1st BCA">1st BCA</option>
      <option value="2nd BCA">2nd BCA</option>
      <option value="3rd BCA">3rd BCA</option>
      <option value="BCA">BCA</option>
      <option value="1st BCOM">1st BCOM</option>
      <option value="2nd BCOM">2nd BCOM</option>
      <option value="3rd BCOM">3rd BCOM</option>
      <option value="BCOM">BCOM</option>
      <option value="All Students">All Students</option>
      <option value="Other">Other</option>
    </select>

    <input type="text" id="otherAudience" placeholder="Enter Custom Audience" style="display:none;">

    <input type="file" id="brochureFile">

    <button id="submitBtn">Add Event</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Theme</th>
        <th>Resource Person</th>
        <th>Category</th>
        <th>Club</th>
        <th>Date</th>
        <th>Time</th>
        <th>Venue</th>
        <th>Audience</th>
        <th>Brochure</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="eventTable"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = supabase.createClient(
"https://oszgllewojvqcbehrtub.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zemdsbGV3b2p2cWNiZWhydHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMjYzODIsImV4cCI6MjA4NzYwMjM4Mn0.Doz6ApUcY1HLsAx7HH1EX1Lx0QNLg7R3gl12jLfsmD0"
);

/* DATE LIMIT */
function setMinDate(){
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("date").setAttribute("min", today);
}
setMinDate();

/* VENUE OTHER */
document.getElementById("venue").addEventListener("change", function(){
  const other = document.getElementById("otherVenue");
  if(this.value === "Other"){
    other.style.display = "block";
  } else {
    other.style.display = "none";
    other.value = "";
  }
});

/* AUDIENCE OTHER */
document.getElementById("audience").addEventListener("change", function(){
  const otherInput = document.getElementById("otherAudience");
  if(this.value === "Other"){
    otherInput.style.display = "block";
  } else {
    otherInput.style.display = "none";
    otherInput.value = "";
  }
});

/* SUBMIT */
document.getElementById("submitBtn").addEventListener("click", async () => {

  const theme = document.getElementById("theme").value;
  const category = document.getElementById("category").value;
  const club = document.getElementById("club").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;

  let venue = document.getElementById("venue").value;
  const otherVenue = document.getElementById("otherVenue").value;
  if(venue === "Other") venue = otherVenue;

  const resourcePerson = document.getElementById("resourcePerson").value;

  let audience = document.getElementById("audience").value;
  const otherAudience = document.getElementById("otherAudience").value;
  if(audience === "Other") audience = otherAudience;

  const today = new Date().toISOString().split("T")[0];
  if(date < today){
    alert("Past dates are not allowed ❌");
    return;
  }

  if(!theme || !category || !date || !time || !venue){
    alert("Please fill required fields");
    return;
  }

  await supabaseClient.from("events").insert([{
    theme,category,club,date,time,venue,resourcePerson,audience
  }]);

  alert("Event Saved Successfully ✅");

});

</script>

</body>
</html>
